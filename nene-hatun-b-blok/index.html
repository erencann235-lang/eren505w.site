h2{font-size:23px;line-height:1.3;margin:0 0 9px}
p{font-size:14px;line-height:1.7;color:var(--muted);margin:0}
.whatsapp{display:flex;align-items:center;justify-content:center;gap:11px;margin:27px auto 0;min-height:54px;padding:0 22px;border-radius:13px;background:#20b965;color:#fff;text-decoration:none;font-size:15px;font-weight:700;box-shadow:0 8px 20px rgba(32,185,101,.2);transition:transform .18s,filter .18s}
.whatsapp:hover{transform:translateY(-2px);filter:brightness(.97)}
.whatsapp svg{width:22px;height:22px;flex:none}
footer{margin-top:22px;font-size:11px;color:#9aa7b2}
@media(max-width:420px){main{padding:32px 21px 25px;border-radius:20px}}
