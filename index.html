<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>eren505w</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;min-height:100svh;overflow:hidden;background:#080b12;color:#fff;display:grid;place-items:center}
    .backdrop{position:fixed;inset:0;overflow:hidden;background:
      radial-gradient(ellipse at 18% 20%,rgba(36,99,235,.22),transparent 38%),
      radial-gradient(ellipse at 82% 78%,rgba(14,165,233,.16),transparent 36%),
      linear-gradient(135deg,#080b12 0%,#101827 52%,#080b12 100%)}
    .backdrop:before,.backdrop:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.07);border-radius:50%;width:70vw;height:70vw;max-width:900px;max-height:900px;min-width:500px;min-height:500px;left:50%;top:50%;transform:translate(-50%,-50%)}
    .backdrop:after{width:52vw;height:52vw;min-width:360px;min-height:360px;border-color:rgba(125,211,252,.10)}
    .page{position:relative;z-index:1;width:min(100% - 40px,900px);min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 0}
    .topline{position:absolute;top:34px;left:0;right:0;display:flex;justify-content:center;align-items:center;color:rgba(255,255,255,.48);font-size:11px;letter-spacing:4px;text-transform:uppercase}
    .mark{width:84px;height:84px;border:1px solid rgba(125,211,252,.42);border-radius:25px;display:grid;place-items:center;margin-bottom:30px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.025));box-shadow:0 18px 70px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.14);font-size:22px;font-weight:900;letter-spacing:-1px;color:#c7efff}
    h1{margin:0;font-size:clamp(42px,9vw,92px);line-height:1;letter-spacing:-5px;font-weight:900}
    h1 span{color:#8bdcff}
    .line{width:54px;height:3px;border-radius:4px;background:#8bdcff;margin:28px auto}
    .subtitle{margin:0;color:rgba(255,255,255,.62);font-size:clamp(14px,2vw,17px);letter-spacing:1.2px}
    .enter{margin-top:42px;display:inline-flex;align-items:center;justify-content:center;gap:18px;min-width:210px;padding:17px 27px;border-radius:999px;background:#f4f8fb;color:#0a1220;text-decoration:none;font-size:14px;font-weight:800;letter-spacing:.5px;transition:transform .25s,box-shadow .25s,background .25s;box-shadow:0 12px 40px rgba(125,211,252,.16)}
    .enter:hover{transform:translateY(-3px);background:#8bdcff;box-shadow:0 18px 55px rgba(56,189,248,.28)}
    .arrow{font-size:20px;line-height:10px}
    .bottom{position:absolute;bottom:30px;color:rgba(255,255,255,.32);font-size:11px;letter-spacing:2px}
    @media(max-width:480px){.topline{top:24px;font-size:9px}.mark{width:72px;height:72px;border-radius:21px}h1{letter-spacing:-3px}.enter{margin-top:34px}.bottom{bottom:22px}}
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="page">
    <div class="topline">OFFICIAL ONLINE STORE</div>
    <div class="mark" aria-hidden="true">505W</div>
    <h1>eren<span>505w</span></h1>
    <div class="line"></div>
    <p class="subtitle">Farklı detaylar. Özgün seçimler.</p>
    <a class="enter" href="https://www.shopier.com/eren505w/52108836" target="_blank" rel="noopener">
      SHOPIER'E GİT <span class="arrow">↗</span>
    </a>
    <div class="bottom">© 2026 EREN505W</div>
  </main>
</body>
</html>
