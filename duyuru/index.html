<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d2b">
<title>Anadolu Sitesi | Bildiriminiz Alındı</title>
<style>
:root{color-scheme:dark;--navy:#101d2b;--gold:#d9bd8b;--cream:#f7f3ea}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#263d50 0,transparent 38%),linear-gradient(145deg,#0b1420,#172b3b);font-family:Arial,Helvetica,sans-serif;color:var(--cream)}
.card{width:min(100%,680px);padding:clamp(30px,7vw,64px);text-align:center;background:linear-gradient(155deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid rgba(217,189,139,.65);outline:1px solid rgba(217,189,139,.2);outline-offset:8px;box-shadow:0 24px 80px #0008;border-radius:22px}
.mark{width:76px;height:76px;margin:0 auto 28px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:36px}
.kicker{font-size:12px;letter-spacing:4px;color:var(--gold);font-weight:700}
h1{font-size:clamp(30px,6vw,48px);line-height:1.13;letter-spacing:-1.5px;margin:18px 0 12px}
.rule{width:76px;height:2px;background:var(--gold);margin:25px auto}
.lead{font-size:clamp(17px,3vw,21px);line-height:1.55;font-weight:700}
p{max-width:490px;margin:15px auto 0;color:#d0d8de;font-size:15px;line-height:1.85}
.thanks{margin-top:34px;color:var(--gold);font-size:12px;letter-spacing:2px;font-weight:700}
@media(max-width:420px){body{padding:20px}.card{border-radius:17px}.kicker{letter-spacing:3px}}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">✓</div>
  <div class="kicker">ANADOLU SİTESİ YÖNETİMİ</div>
  <h1>Dilek ve Şikâyetiniz<br>Alınmıştır</h1>
  <div class="rule"></div>
  <div class="lead">Bildiriminiz tarafımıza başarıyla ulaşmıştır.</div>
  <p>İletilen tüm dilek ve şikâyetler yönetim tarafından değerlendirilerek gerekli işlemler yapılacaktır.</p>
  <div class="thanks">İLGİNİZ İÇİN TEŞEKKÜR EDERİZ</div>
</main>
</body>
</html>
