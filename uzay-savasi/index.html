<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050817"><title>UZAY SAVAŞI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:#eff7ff;font-family:Arial,Helvetica,sans-serif;touch-action:none}#wrap{position:relative;width:100vw;height:100dvh;display:grid;place-items:center}canvas{width:min(100vw,160vh);height:min(100dvh,62.5vw);display:block;background:#070b20;border:1px solid #4562a2;box-shadow:0 0 55px #264cc455;touch-action:none}.hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(900px,94vw);display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 8px #000}.hud span{background:#08112dcc;border:1px solid #637bc755;border-radius:9px;padding:9px 13px}.hud b{color:#68f3ff}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#020617c9;padding:18px}.panel{max-width:430px;width:94%;padding:32px 26px;text-align:center;border:1px solid #68dfff66;border-radius:20px;background:linear-gradient(145deg,#15234a,#090e22);box-shadow:0 0 55px #40d9ff22}.panel h1{font-size:clamp(34px,7vw,58px);line-height:.95;margin:0 0 14px;letter-spacing:-2px}.panel h1 em{font-style:normal;color:#68f3ff}.panel p{color:#bac9e8;line-height:1.55;font-size:14px}.panel button{border:0;border-radius:10px;padding:15px 25px;width:100%;background:linear-gradient(90deg,#61f2ef,#7aaaff);color:#061126;font-weight:900;letter-spacing:1px;font-size:15px;cursor:pointer}.note{font-size:11px;color:#92a7d1;margin-top:15px}.hidden{display:none!important}@media(max-aspect-ratio:1/1){canvas{width:100vw;height:100dvh;border:0}.hud{top:8px}.hud span{font-size:12px;padding:7px 9px}}
</style></head><body><div id="wrap"><canvas id="c" width="960" height="600"></canvas><div class="hud"><span>SKOR <b id="score">0</b></span><span>CAN <b id="life">3</b></span><span>SEVİYE <b id="level">1</b></span></div>
<div class="overlay" id="menu"><div class="panel"><h1>UZAY<br><em>SAVAŞI</em></h1><p>Uzay gemini kontrol et, meteorları ve düşman gemilerini yok et. Hayatta kalabildiğin kadar kal!</p><button id="start">SAVAŞA BAŞLA</button><div class="note">Hareket: WASD / Ok tuşları · Ateş: Boşluk veya fare tıklaması<br>Telefonda parmağınla gemiyi sürükle.</div></div></div>
<div class="overlay hidden" id="over"><div class="panel"><h1>GÖREV<br><em>TAMAMLANDI</em></h1><p id="final">Skor: 0</p><button id="again">TEKRAR OYNA</button></div></div></div>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id),W=960,H=600;let mode='menu',ship,bullets,rocks,foes,stars,keys={},score=0,lives=3,level=1,timer=0,last=0,fire=0,pointer=null;
function reset(){score=0;lives=3;level=1;timer=0;fire=0;ship={x:480,y:500,inv:1.5};bullets=[];rocks=[];foes=[];stars=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*2}));hud()}
function hud(){$('score').textContent=score;$('life').textContent=lives;$('level').textContent=level}
function begin(){reset();mode='play';$('menu').classList.add('hidden');$('over').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
$('start').onclick=begin;$('again').onclick=begin;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointerdown',e=>{pointer=pos(e);if(e.pointerType==='mouse')keys.space=true});c.addEventListener('pointermove',e=>{if(pointer)pointer=pos(e)});addEventListener('pointerup',()=>{pointer=null;keys.space=false});
function spawn(){let r=18+Math.random()*22;rocks.push({x:25+Math.random()*(W-50),y:-r,r,v:90+Math.random()*90+level*8,rot:Math.random()*6,spin:(Math.random()-.5)*2,hp:r>34?2:1})}
function shoot(){bullets.push({x:ship.x-9,y:ship.y-18,v:440});bullets.push({x:ship.x+9,y:ship.y-18,v:440})}
function hit(){if(ship.inv>0)return;lives--;ship.inv=1.5;hud();if(lives<=0){mode='over';$('final').textContent='Toplam skorun: '+score;$('over').classList.remove('hidden')}}
function update(dt){timer+=dt;level=1+Math.floor(score/150);if(timer>Math.max(.3,1.1-level*.07)){spawn();timer=0}if(ship.inv>0)ship.inv-=dt;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(pointer){ship.x+=(pointer.x-ship.x)*Math.min(1,dt*10);ship.y+=(pointer.y-ship.y)*Math.min(1,dt*10)}else{ship.x+=dx*330*dt;ship.y+=dy*330*dt}ship.x=Math.max(25,Math.min(W-25,ship.x));ship.y=Math.max(55,Math.min(H-35,ship.y));fire-=dt;if((keys.space||keys[' '])&&fire<=0){shoot();fire=.22}
for(let b of bullets)b.y-=b.v*dt;bullets=bullets.filter(b=>b.y>-10);
for(let r of rocks){r.y+=r.v*dt;r.rot+=r.spin*dt;for(let b of bullets){if(!b.dead&&Math.hypot(b.x-r.x,b.y-r.y)<r.r){b.dead=true;r.hp--;if(r.hp<=0){r.dead=true;score+=10;hud()}}}if(!r.dead&&Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+17){r.dead=true;hit()}}rocks=rocks.filter(r=>!r.dead&&r.y<H+60);bullets=bullets.filter(b=>!b.dead);
if(level>1&&Math.random()<dt*.22){foes.push({x:Math.random()*W,y:-30,v:110+level*8})}
for(let f of foes){f.y+=f.v*dt;if(Math.random()<dt*.8)bullets.push({x:f.x,y:f.y+15,v:-220});if(Math.hypot(ship.x-f.x,ship.y-f.y)<24){f.dead=true;hit()}}foes=foes.filter(f=>!f.dead&&f.y<H+40);
for(let s of stars){s.y+=s.s*40*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}}
}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090f2d');g.addColorStop(1,'#101b3d');x.fillStyle=g;x.fillRect(0,0,W,H);for(let s of stars){x.fillStyle='#c7e7ff';x.globalAlpha=.25+s.s*.2;x.fillRect(s.x,s.y,s.s,s.s*2)}x.globalAlpha=1;
for(let r of rocks){x.save();x.translate(r.x,r.y);x.rotate(r.rot);x.fillStyle='#68718a';x.strokeStyle='#b2c4e9';x.lineWidth=2;x.beginPath();for(let i=0;i<9;i++){let a=i*Math.PI*2/9,rr=r.r*(.78+Math.sin(i*8.3)*.18);i?x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):x.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fill();x.stroke();x.restore()}
for(let f of foes){x.fillStyle='#ff5d83';x.beginPath();x.moveTo(f.x,f.y+20);x.lineTo(f.x-18,f.y-14);x.lineTo(f.x,f.y-7);x.lineTo(f.x+18,f.y-14);x.closePath();x.fill()}
for(let b of bullets){x.fillStyle=b.v>0?'#72f8ff':'#ff6688';x.shadowBlur=12;x.shadowColor=x.fillStyle;x.fillRect(b.x-2,b.y-8,4,13)}x.shadowBlur=0;
if(ship&&(ship.inv<=0||Math.floor(ship.inv*12)%2===0)){x.save();x.translate(ship.x,ship.y);x.fillStyle='#6af7ff';x.strokeStyle='#eaffff';x.lineWidth=2;x.shadowBlur=20;x.shadowColor='#43eaff';x.beginPath();x.moveTo(0,-25);x.lineTo(21,20);x.lineTo(0,12);x.lineTo(-21,20);x.closePath();x.fill();x.stroke();x.fillStyle='#ffb65d';x.beginPath();x.moveTo(-7,17);x.lineTo(0,34+Math.random()*8);x.lineTo(7,17);x.fill();x.restore()}x.shadowBlur=0}
function loop(t){if(mode!=='play')return;let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();if(mode==='play')requestAnimationFrame(loop)}
function idle(){if(mode==='menu'||mode==='over'){if(!stars)stars=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*2}));for(let s of stars){s.y+=s.s*.25;if(s.y>H)s.y=0}draw();requestAnimationFrame(idle)}}reset();idle();
})();
</script></body></html>
